name: key-probe
on: pull_request
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the action's CLI version
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.319 >/dev/null 2>&1; ~/.local/bin/claude --version
      - name: A plain Sonnet
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: ~/.local/bin/claude -p "say ok" --model claude-sonnet-5-5 --output-format json 2>&1 | grep -oE '"(result|error|total_cost_usd)":[^,]*' || true
      - name: B plain Opus
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: ~/.local/bin/claude -p "say ok" --model claude-opus-5-5 --output-format json 2>&1 | grep -oE '"(result|error|total_cost_usd)":[^,]*' || true
      - name: C action args, Opus
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: ~/.local/bin/claude -p "say ok" --allowedTools "Bash(git diff *),Bash(git log *)" --model claude-opus-5-5 --max-turns 30 --setting-sources user,project,local --output-format json 2>&1 | grep -oE '"(result|error|total_cost_usd)":[^,]*' || true
      - name: D Opus, effort high
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", CLAUDE_CODE_EFFORT_LEVEL: "high" }
        run: ~/.local/bin/claude -p "say ok" --model claude-opus-5-5 --output-format json 2>&1 | grep -oE '"(result|error|total_cost_usd)":[^,]*' || true
