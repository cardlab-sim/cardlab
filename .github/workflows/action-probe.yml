# TEMPORARY diagnostic: does claude-code-action itself hit billing_error with a trivial prompt?
name: action-probe
on: workflow_dispatch
permissions: { contents: read, id-token: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Env fingerprint (no values)
        env: { K: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: echo "key length ${#K}"; env | grep -oE '^(ANTHROPIC|CLAUDE)[A-Z_]*' | sort -u || true
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Reply with the single word ok. Do not use tools."
          claude_args: "--model claude-sonnet-5-5 --max-turns 2"
          show_full_output: true
