# AI review, comment-only. The job token can only read; the agent's only write tool is the inline-comment tool.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  general:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --model claude-sonnet-5-5 --max-turns 25'

  money:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tier
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed.txt
          echo "tier=$(python3 tools/risk_tier.py docs/sdlc/review-tiers.json < changed.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.tier.outputs.tier != '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} as the money-and-security reviewer.
            Use `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` to read the change.
            Only comment on: money arithmetic and rounding, limit and period boundaries, authorisation decisions,
            audit completeness, card-number exposure (any run of 13+ digits), idempotency and locking, migrations,
            secrets or credentials in code or workflows.
            Post each finding as an inline comment that starts with `[money]` and a severity tag [S1] blocker,
            [S2] major, [S3] minor, [S4] cosmetic, then the acceptance criterion or requirement it affects.
            If there is nothing in scope, post nothing. Never approve, never request changes, never push.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff *),Bash(git log *)" --model claude-opus-5-5 --max-turns 30'